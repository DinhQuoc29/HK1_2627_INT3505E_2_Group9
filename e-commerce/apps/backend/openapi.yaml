        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewRequest' }
            example: { rating: 5, content: Giao nhanh, đúng mô tả. }
      responses:
        '201':
          description: Đã tạo review
          headers:
            Location: { schema: { type: string }, description: 'URL của review: /api/v1/reviews/{id}' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`review-already-exists` (dòng hàng đã có review) hoặc `order-not-completed` (đơn chưa hoàn tất)'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationProblem' }
  /api/v1/reviews/{review_id}:
    patch:
      tags: [reviews]
      summary: Tác giả sửa đánh giá
      description: '**Vai trò:** tác giả của review.'
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ReviewId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                content: { type: string, maxLength: 2000, nullable: true }
      responses:
        '200':
          description: Review sau khi sửa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationProblem' }
    delete:
      tags: [reviews]
      summary: Gỡ đánh giá
      description: |
        Review biến mất khỏi danh sách và không còn tính vào điểm sản phẩm; dòng hàng vẫn **không** được đánh giá lại
        (SPEC-19: giữ định danh lượt gửi để đảm bảo một lần cho mỗi dòng hàng). **Vai trò:** tác giả hoặc admin.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ReviewId'
      responses:
        '204': { description: Đã gỡ }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/reviews/{review_id}/visibility:
    put:
      tags: [reviews]
      summary: Admin ẩn hoặc hiện lại một đánh giá
      description: '`hidden` không tính vào điểm sản phẩm. **Vai trò:** admin.'
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ReviewId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [visible, hidden] }
      responses:
        '200':
          description: Review sau khi cập nhật
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationProblem' }
  /api/v1/users/me/reviews:
    get:
      tags: [reviews]
      summary: Đánh giá của tôi
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationProblem' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    refreshCookie: { type: apiKey, in: cookie, name: refresh_token }
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Chuỗi duy nhất cho mỗi lần xác nhận mua (tối đa 64 ký tự); client tự sinh, ví dụ UUID.
      schema: { type: string, minLength: 1, maxLength: 64 }
    CheckoutId: { name: checkout_id, in: path, required: true, schema: { type: string, format: uuid } }
    OrderId: { name: order_id, in: path, required: true, schema: { type: string, format: uuid } }
    OrderItemId: { name: order_item_id, in: path, required: true, schema: { type: string, format: uuid } }
    ProductId: { name: product_id, in: path, required: true, schema: { type: string, format: uuid } }
    ReviewId: { name: review_id, in: path, required: true, schema: { type: string, format: uuid } }
    OrderStatusFilter:
      name: status
      in: query
      description: Lọc theo trạng thái đơn
      schema: { $ref: '#/components/schemas/OrderStatus' }
    Limit:
      name: limit
      in: query
      description: Số phần tử mỗi trang
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      description: Con trỏ không trong suốt lấy từ `next_cursor` của trang trước
      schema: { type: string }
  responses:
    AuthSession:
      description: Phiên đã được tạo; refresh token nằm trong cookie HttpOnly `refresh_token`
      headers:
        Set-Cookie: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AuthSession' }
    Problem:
      description: Lỗi
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Thiếu/hết hạn/không hợp lệ hoặc phiên đã kết thúc
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationProblem:
      description: Dữ liệu không hợp lệ
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: /problems/validation-error
            title: Unprocessable Content
            status: 422
            detail: Dữ liệu gửi lên không hợp lệ.
            instance: /api/v1/users
            errors:
              - { field: password, message: Mật khẩu cần có cả chữ và số. }
    Forbidden:
      description: Không đủ quyền (sai vai trò hoặc không phải chủ tài nguyên)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: /problems/forbidden
            title: Forbidden
            status: 403
            detail: Bạn không có quyền thực hiện thao tác này.
            instance: /api/v1/orders/0190a1b2-0000-7000-8000-00000000c003
    NotFound:
      description: Không tìm thấy tài nguyên
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InvalidTransition:
      description: Trạng thái hiện tại không cho phép chuyển (`invalid-order-transition`); không có tác động phụ nào được chạy
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: /problems/invalid-order-transition
            title: Conflict
            status: 409
            detail: Đơn đang ở trạng thái cancelled nên không thể hủy.
            instance: /api/v1/orders/0190a1b2-0000-7000-8000-00000000c003/cancellation
  schemas:
    ShopStatistics:
      type: object
      required: [total_orders, orders_by_status, captured_orders, recorded_revenue_vnd]
      properties:
        total_orders: { type: integer, format: int64, minimum: 0 }
        orders_by_status:
          type: object
          required: [pending_payment, paid, shipping, completed, cancelled]
          additionalProperties: false
          properties:
            pending_payment: { type: integer, format: int64, minimum: 0 }
            paid: { type: integer, format: int64, minimum: 0 }
            shipping: { type: integer, format: int64, minimum: 0 }
            completed: { type: integer, format: int64, minimum: 0 }
            cancelled: { type: integer, format: int64, minimum: 0 }
        captured_orders: { type: integer, format: int64, minimum: 0 }
        recorded_revenue_vnd:
          type: string
          pattern: '^[0-9]+$'
          description: Tổng doanh thu ghi nhận bằng VND, dạng chuỗi để giữ chính xác số nguyên lớn.
    ProductCategoryOption:
      type: object
      required: [id, name, parent_name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        parent_name: { type: string }
    SellerProductStatus: { type: string, enum: [active, inactive] }
    SellerProductInput:
      type: object
      additionalProperties: false
      required: [name, description, category_id, price, quantity, images]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        brand: { type: string, nullable: true, maxLength: 100 }
        description: { type: string, minLength: 1, maxLength: 5000 }
        category_id: { type: string, format: uuid }
        price: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991 }
        quantity: { type: integer, format: int32, minimum: 0, maximum: 2147483647 }
        images:
          type: array
          minItems: 1
          maxItems: 8
          description: URL HTTP hoặc HTTPS theo thứ tự, ảnh đầu tiên là ảnh đại diện
          items: { type: string, format: uri, maxLength: 500 }
    SellerProduct:
      type: object
      required: [id, name, brand, description, category_id, category_name, price, quantity, images, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        brand: { type: string, nullable: true }
        description: { type: string, nullable: true }
        category_id: { type: string, format: uuid }
        category_name: { type: string }
        price: { type: integer, format: int64 }
        quantity: { type: integer, format: int32 }
        images:
          type: array
          items: { type: string }
        status: { $ref: '#/components/schemas/SellerProductStatus' }
    RegisterRequest:
      type: object
      required: [email, password, full_name]
      properties:
        email: { type: string, format: email, maxLength: 255 }
        password: { type: string, minLength: 8, maxLength: 72, description: 'Có cả chữ và số, tối đa 72 byte' }
        full_name: { type: string, minLength: 1, maxLength: 100 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        full_name: { type: string }
        role: { type: string, enum: [buyer, seller, admin] }
        created_at: { type: string, format: date-time }
        providers:
          type: array
          items: { type: string, enum: [google, facebook] }
          description: Nhà cung cấp OAuth đã liên kết (trường tính toán từ user_identities)
        has_password: { type: boolean, description: 'false nếu tài khoản chỉ đăng nhập bằng Google/Facebook (trường tính toán)' }
        email_verified: { type: boolean, description: 'Email đã xác minh (cần để đăng ký bán hàng)' }
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [new_password]
      properties:
        current_password: { type: string, nullable: true, description: 'Bắt buộc nếu tài khoản đã có mật khẩu' }
        new_password: { type: string, minLength: 8, description: 'Cần có cả chữ và số, tối đa 72 byte' }
    AdminUser:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        full_name: { type: string }
        role: { type: string, enum: [buyer, seller, admin] }
        status: { type: string, enum: [active, suspended] }
        created_at: { type: string, format: date-time }
        has_shop: { type: boolean }
    AdminUserPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminUser' }
        next_cursor: { type: string, nullable: true }
    AdminUpdateUserRequest:
      type: object
      additionalProperties: false
      properties:
        role: { type: string, enum: [buyer, admin], description: 'seller chỉ có được bằng cách mở shop' }
        status: { type: string, enum: [active, suspended] }
    TokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, minLength: 20, maxLength: 200 }
    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email }
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, new_password]
      properties:
        token: { type: string, minLength: 20, maxLength: 200 }
        new_password: { type: string, minLength: 8, description: 'Cần có cả chữ và số, tối đa 72 byte' }
    SellerApplication:
      type: object
      properties:
        id: { type: string, format: uuid }
        shop_name: { type: string }
        province_code: { type: string }
        province_name: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        reject_reason: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        reviewed_at: { type: string, format: date-time, nullable: true }
    AdminSellerApplication:
      allOf:
        - $ref: '#/components/schemas/SellerApplication'
        - type: object
          properties:
            applicant_id: { type: string, format: uuid }
            applicant_email: { type: string, format: email }
            applicant_name: { type: string }
    AdminSellerApplicationPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminSellerApplication' }
        next_cursor: { type: string, nullable: true }
    RejectApplicationRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }
    Province:
      type: object
      properties:
        code: { type: string, example: HN }
        name: { type: string, example: Hà Nội }
    CreateShopRequest:
      type: object
      additionalProperties: false
      required: [name, province_code]
      properties:
        name: { type: string, minLength: 3, maxLength: 150 }
        province_code: { type: string, maxLength: 4, description: Mã tỉnh/thành từ GET /provinces }
    Shop:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        province: { $ref: '#/components/schemas/Province' }
        created_at: { type: string, format: date-time }
    AuthSession:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, example: 900 }
        user: { $ref: '#/components/schemas/User' }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, example: /problems/validation-error }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
    Money:
      type: integer
      format: int64
      minimum: 0
      description: Số tiền VND (số nguyên)
      example: 189000
    OrderStatus:
      type: string
      enum: [pending_payment, paid, shipping, completed, cancelled]
    CheckoutRequest:
      type: object
      required: [items, shipping]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [product_id, quantity, expected_unit_price]
            properties:
              product_id: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1 }
              expected_unit_price: { allOf: [{ $ref: '#/components/schemas/Money' }], description: Giá client đang thấy; khác giá hiện tại thì 409 }
        shipping: { $ref: '#/components/schemas/Shipping' }
    Shipping:
      type: object
      required: [name, phone, address]
      properties:
        name: { type: string, maxLength: 100 }
        phone: { type: string, maxLength: 20 }
        address: { type: string, maxLength: 500 }
    OrderItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        product_name: { type: string, description: Snapshot tên lúc đặt }
        unit_price: { $ref: '#/components/schemas/Money' }
        quantity: { type: integer }
        line_total: { $ref: '#/components/schemas/Money' }
        has_review: { type: boolean, description: 'Trường tính toán, không có trong bảng order_items' }
    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        checkout_id: { type: string, format: uuid }
        shop: { type: object, properties: { id: { type: string, format: uuid }, name: { type: string } } }
        status: { $ref: '#/components/schemas/OrderStatus' }
        total_amount: { $ref: '#/components/schemas/Money' }
        shipping: { $ref: '#/components/schemas/Shipping' }
        items: { type: array, items: { $ref: '#/components/schemas/OrderItem' } }
        paid_at: { type: string, format: date-time, nullable: true }
        shipped_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }
        cancelled_at: { type: string, format: date-time, nullable: true }
        cancelled_by: { type: string, enum: [buyer, seller], nullable: true }
        created_at: { type: string, format: date-time }
    OrderPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Order' } }
        next_cursor: { type: string, nullable: true, description: null nếu hết dữ liệu }
    PaymentAllocation:
      type: object
      properties:
        order_id: { type: string, format: uuid }
        amount: { $ref: '#/components/schemas/Money' }
        status: { type: string, enum: [captured, refunded] }
        refunded_at: { type: string, format: date-time, nullable: true }
    Payment:
      type: object
      properties:
        id: { type: string, format: uuid }
        checkout_id: { type: string, format: uuid }
        method: { type: string, enum: [simulated], description: v1 chỉ có thanh toán giả lập }
        status: { type: string, enum: [pending, succeeded, failed, cancelled] }
        amount: { $ref: '#/components/schemas/Money' }
        refunded_amount: { $ref: '#/components/schemas/Money' }
        attempt_count: { type: integer }
        paid_at: { type: string, format: date-time, nullable: true }
        allocations: { type: array, items: { $ref: '#/components/schemas/PaymentAllocation' } }
    Checkout:
      type: object
      properties:
        id: { type: string, format: uuid }
        total_amount: { $ref: '#/components/schemas/Money' }
        created_at: { type: string, format: date-time }
        orders: { type: array, items: { $ref: '#/components/schemas/Order' } }
        payment: { $ref: '#/components/schemas/Payment' }
    Inventory:
      type: object
      properties:
        product_id: { type: string, format: uuid }
        quantity: { type: integer, minimum: 0 }
        updated_at: { type: string, format: date-time, nullable: true }
    ReviewRequest:
      type: object
      required: [rating]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        content: { type: string, maxLength: 2000, nullable: true }
    Review:
      type: object
      properties:
        id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        order_item_id: { type: string, format: uuid }
        author: { type: object, properties: { full_name: { type: string } }, description: 'Chỉ tên hiển thị, không lộ user_id hay email' }
        rating: { type: integer, minimum: 1, maximum: 5 }
        content: { type: string, nullable: true }
        status: { type: string, enum: [visible, hidden] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ReviewPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Review' } }
        next_cursor: { type: string, nullable: true }
    PriceChangedProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            changes:
              type: array
              items:
                type: object
                properties:
                  product_id: { type: string, format: uuid }
                  expected_unit_price: { $ref: '#/components/schemas/Money' }
                  current_unit_price: { $ref: '#/components/schemas/Money' }
    InsufficientStockProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            products:
              type: array
              items:
                type: object
                properties:
                  product_id: { type: string, format: uuid }
                  requested: { type: integer }
                  available: { type: integer }
