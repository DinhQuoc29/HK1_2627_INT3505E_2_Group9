openapi: 3.0.3
info:
  title: E-commerce API
  version: 1.0.0
  description: |
    Accounts (đăng ký, đăng nhập, phiên), Checkout và Orders, Payments (giả lập), Inventory và Reviews.
    Đã có danh sách đơn của shop, chi tiết đơn và cập nhật giao hàng.
    Luồng tạo đơn, thanh toán, lịch sử đơn của buyer, hủy đơn, Reviews và API Inventory riêng mới có đặc tả.

    **Quy ước.** Path chữ thường, kebab-case, danh từ số nhiều; query snake_case. Tiền là số nguyên VND.
    Danh sách phân trang cursor `?limit=&cursor=` trả `{items, next_cursor}`. Chuyển trạng thái đơn mô hình hóa
    như tài nguyên con (`/orders/{id}/cancellation`, `/shipment`, `/completion`).
    Sản phẩm của gian hàng dùng `?page=&limit=` và trả `{items, has_more}`.

    **Xác thực.** Access token là JWT (HS256, 15 phút) gửi qua `Authorization: Bearer`. Claim `sid` trỏ tới
    `auth_sessions`; mỗi request được bảo vệ đều kiểm tra phiên còn hiệu lực nên logout có hiệu lực ngay.
    Refresh token là chuỗi ngẫu nhiên (DB chỉ lưu SHA-256), nằm trong cookie `HttpOnly; SameSite=Lax; Path=/api/v1/auth`
    và được xoay vòng ở mỗi lần làm mới.

    **Lỗi.** Mọi lỗi trả `application/problem+json` (RFC 9457).
servers:
  - url: http://localhost:5000
tags:
  - name: users
  - name: auth
  - name: shops
  - name: catalog
  - name: admin
  - name: sellers
  - name: checkouts
  - name: orders
  - name: payments
  - name: inventory
  - name: reviews
paths:
  /api/v1/users:
    post:
      tags: [users]
      summary: Đăng ký tài khoản buyer (và mở phiên đăng nhập)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
            example: { email: an@example.com, password: Matkhau123, full_name: Nguyễn Văn An }
      responses:
        '201': { $ref: '#/components/responses/AuthSession' }
        '400': { $ref: '#/components/responses/Problem' }
        '409':
          description: Email đã được đăng ký
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: /problems/email-already-registered
                title: Conflict
                status: 409
                detail: Email này đã được đăng ký.
                instance: /api/v1/users
        '422': { $ref: '#/components/responses/ValidationProblem' }
        '429':
          description: Thao tác quá nhanh (`rate-limited`)
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/v1/users/me:
    get:
      tags: [users]
      summary: Hồ sơ của người dùng đang đăng nhập
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/users/me/identities:
    post:
      tags: [users]
      summary: Liên kết tài khoản Google hoặc Facebook với người dùng đang đăng nhập
      description: |
        Mỗi người dùng liên kết tối đa một tài khoản cho mỗi nhà cung cấp, và mỗi tài khoản bên thứ ba chỉ thuộc một người dùng.
        Nhà cung cấp không phản hồi trả 503 và không thay đổi gì. `credential` là ID token (Google) hoặc access token (Facebook).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, credential]
              properties:
                provider: { type: string, enum: [google, facebook] }
                credential: { type: string, description: 'Google: ID token; Facebook: access token' }
      responses:
        '201':
          description: Hồ sơ sau khi liên kết
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: '`provider-already-linked` (bạn đã liên kết nhà cung cấp này) hoặc `google-account-in-use` / `facebook-account-in-use` (tài khoản đó thuộc người khác)'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationProblem' }
        '503':
          description: Không kết nối được Google (có thể thử lại)
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/v1/users/me/identities/{provider}:
    delete:
      tags: [users]
      summary: Hủy liên kết một nhà cung cấp đăng nhập
      description: Không cho hủy khi đó là cách đăng nhập duy nhất (không có mật khẩu và không còn nhà cung cấp nào khác) để không bị khóa khỏi tài khoản.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [google, facebook] }
      responses:
        '204': { description: Đã hủy liên kết }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Chưa liên kết nhà cung cấp này (`identity-not-found`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Đây là cách đăng nhập duy nhất (`last-login-method`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/v1/auth/sessions:
    post:
      tags: [auth]
      summary: Đăng nhập bằng email và mật khẩu
      description: Sai 5 lần liên tiếp thì khóa 15 phút (429 + Retry-After). Email sai và mật khẩu sai trả cùng một lỗi.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '201': { $ref: '#/components/responses/AuthSession' }
        '401':
          description: Sai email hoặc mật khẩu
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: /problems/invalid-credentials
                title: Unauthorized
                status: 401
                detail: Email hoặc mật khẩu không đúng.
                instance: /api/v1/auth/sessions
        '422': { $ref: '#/components/responses/ValidationProblem' }
        '429':
          description: Tài khoản bị khóa tạm thời
          headers:
            Retry-After: { schema: { type: integer }, description: Số giây còn bị khóa }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/v1/auth/sessions/google:
    post:
      tags: [auth]
      summary: Đăng nhập bằng Google (ID token từ Google Identity Services)
      description: |
        Tra theo (google, sub). Chưa có thì: email Google đã xác minh trùng user sẵn có → liên kết;
        không trùng → tạo user mới không mật khẩu. Google không phản hồi → 503, không tạo phiên hay tài khoản.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                credential: { type: string, description: ID token (JWT) do Google cấp }
      responses:
        '201': { $ref: '#/components/responses/AuthSession' }
        '401': { $ref: '#/components/responses/Problem' }
        '429':
          description: Thao tác quá nhanh (`rate-limited`)
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: Không kết nối được Google (có thể thử lại)
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/v1/auth/sessions/facebook:
    post:
      tags: [auth]
      summary: Đăng nhập hoặc đăng ký bằng Facebook (access token từ Facebook Login)
      description: |
        Server xác minh token qua Graph API (`debug_token`: còn hạn và cấp cho đúng app, rồi `/me`).
        Tra theo (facebook, id); chưa có thì tạo user mới không mật khẩu (cần email từ Facebook).
        **Không tự gộp** vào tài khoản có sẵn trùng email (409 `account-exists`): người dùng đăng nhập bằng cách khác
        rồi liên kết Facebook ở `POST /users/me/identities`. Facebook không phản hồi trả 503, không tạo phiên hay tài khoản.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [access_token]
              properties:
                access_token: { type: string, description: Access token do Facebook Login cấp }
      responses:
        '201': { $ref: '#/components/responses/AuthSession' }
        '401': { $ref: '#/components/responses/Problem' }
        '409':
          description: Email Facebook đã có tài khoản (`account-exists`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Facebook không cung cấp email nên không tạo được tài khoản (`facebook-email-missing`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          description: Thao tác quá nhanh (`rate-limited`)
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: Không kết nối được Facebook hoặc chưa cấu hình (có thể thử lại)
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/v1/auth/sessions/current:
    delete:
      tags: [auth]
      summary: Đăng xuất (thu hồi phiên hiện tại)
      security: [{ bearerAuth: [] }]
      responses:
        '204':
          description: Đã thu hồi phiên và xóa cookie refresh
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/tokens:
    post:
      tags: [auth]
      summary: Đổi refresh token (cookie) lấy access token mới
      description: Refresh token được xoay vòng; token cũ dùng lại sẽ bị từ chối.
      security: [{ refreshCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/AuthSession' }
        '401': { $ref: '#/components/responses/Problem' }
  /api/v1/users/me/password:
    put:
      tags: [users]
      summary: Đổi mật khẩu (hoặc đặt mật khẩu lần đầu cho tài khoản chỉ đăng nhập social)
      description: Thành công thì mọi phiên khác của người dùng bị thu hồi; phiên hiện tại giữ nguyên.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204': { description: Đã đổi mật khẩu }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationProblem' }
  /api/v1/admin/users:
    get:
      tags: [admin]
      summary: Danh sách người dùng (admin)
      description: Mới nhất trước, phân trang cursor. **Vai trò:** admin.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: role, in: query, schema: { type: string, enum: [buyer, seller, admin] } }
        - { name: status, in: query, schema: { type: string, enum: [active, suspended] } }
        - { name: q, in: query, description: 'Tìm theo email hoặc họ tên', schema: { type: string, maxLength: 100 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationProblem' }
  /api/v1/admin/users/{user_id}:
    parameters:
      - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [admin]
      summary: Chi tiết một người dùng (admin)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Không có người dùng (`user-not-found`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    patch:
      tags: [admin]
      summary: Khóa/mở khóa tài khoản hoặc cấp/thu quyền admin
      description: |
        `status: suspended` thu hồi mọi phiên của người dùng ngay lập tức. Không áp dụng cho chính mình (409
        `cannot-modify-self`). Người bán (đang có shop) không đổi vai trò được (409 `seller-has-shop`); chỉ khóa được.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminUpdateUserRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Không có người dùng (`user-not-found`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: '`cannot-modify-self` hoặc `seller-has-shop`'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationProblem' }
  /api/v1/auth/email-verifications:
    post:
      tags: [auth]
      summary: Gửi lại email xác minh (người đang đăng nhập)
      description: Email chứa liên kết có hiệu lực vài giờ. Hai lần gửi cách nhau tối thiểu vài chục giây (429).
      security: [{ bearerAuth: [] }]
      responses:
        '202': { description: Đã xếp hàng gửi email }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Email đã được xác minh (`email-already-verified`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          description: Gửi quá nhanh (`rate-limited`)
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/v1/auth/email-verifications/confirmation:
    post:
      tags: [auth]
      summary: Xác minh email bằng token trong liên kết
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenRequest' }
      responses:
        '204': { description: Đã xác minh }
        '400':
          description: Token sai, đã dùng hoặc hết hạn (`invalid-email-token`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationProblem' }
        '429':
          description: Thao tác quá nhanh (`rate-limited`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/v1/auth/password-resets:
    post:
      tags: [auth]
      summary: Yêu cầu đặt lại mật khẩu (gửi email)
      description: Luôn trả 202 dù email có tồn tại hay không, để không lộ danh sách tài khoản.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForgotPasswordRequest' }
      responses:
        '202': { description: Nếu email tồn tại thì liên kết đặt lại đã được gửi }
        '422': { $ref: '#/components/responses/ValidationProblem' }
        '429':
          description: Thao tác quá nhanh (`rate-limited`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/v1/auth/password-resets/confirmation:
    post:
      tags: [auth]
      summary: Đặt mật khẩu mới bằng token trong email
      description: Token dùng một lần. Thành công thì mọi phiên của người dùng bị thu hồi và email được coi là đã xác minh.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '204': { description: Đã đổi mật khẩu }
        '400':
          description: Token sai, đã dùng hoặc hết hạn (`invalid-reset-token`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationProblem' }
        '429':
          description: Thao tác quá nhanh (`rate-limited`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/v1/seller-applications:
    post:
      tags: [sellers]
      summary: Nộp hồ sơ đăng ký người bán
      description: |
        Buyer đã xác minh email nộp tên shop và tỉnh/thành; admin duyệt thì mới thành seller. Mỗi người chỉ có một
        hồ sơ đang chờ (409 `application-pending`). **Vai trò:** buyer.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateShopRequest' }
      responses:
        '201':
          description: Đã nộp hồ sơ và lên lịch gửi email xác nhận cho người nộp
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SellerApplication' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Admin, hoặc chưa xác minh email (`email-not-verified`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Đã có shop (`shop-already-exists`) hoặc đã có hồ sơ chờ duyệt (`application-pending`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationProblem' }
  /api/v1/seller-applications/me:
    get:
      tags: [sellers]
      summary: Hồ sơ người bán gần nhất của tôi
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SellerApplication' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Chưa nộp hồ sơ (`application-not-found`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/v1/admin/seller-applications:
    get:
      tags: [sellers]
      summary: Danh sách hồ sơ người bán (admin)
      description: Mới nhất trước, phân trang cursor. **Vai trò:** admin.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, approved, rejected] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSellerApplicationPage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationProblem' }
  /api/v1/admin/seller-applications/{application_id}/approval:
    post:
      tags: [sellers]
      summary: Duyệt hồ sơ (tạo shop và nâng người nộp lên seller)
      description: Gửi email thông báo cho người nộp. **Vai trò:** admin.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: application_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSellerApplication' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Không có hồ sơ (`application-not-found`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
