services:
  db:
    image: postgres:16
    container_name: ecommerce-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecommerce}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Chạy các file *.sql theo thứ tự tên ở lần khởi tạo volume đầu tiên.
      - ./apps/backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecommerce} -d ${POSTGRES_DB:-ecommerce}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Hộp thư giả cho dev (tùy chọn): docker compose --profile mail up -d mailpit
  # SMTP localhost:1025, xem thư tại http://localhost:8025. Dùng với EMAIL_BACKEND=smtp trong .env.
  mailpit:
    image: axllent/mailpit:latest
    container_name: ecommerce-mailpit
    profiles: ["mail"]
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
