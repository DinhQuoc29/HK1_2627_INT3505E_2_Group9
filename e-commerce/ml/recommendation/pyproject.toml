[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fashion-reco"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scikit-learn>=1.4,<2", "rank-bm25>=0.2.2,<1", "PyYAML>=6,<7", "joblib>=1.3,<2"]

[project.optional-dependencies]
analysis = ["pandas>=2,<3", "matplotlib>=3.8,<4"]
kaggle = ["sentence-transformers>=3,<6", "lightgbm>=4,<5", "pandas>=2,<3", "matplotlib>=3.8,<4"]

[tool.setuptools.packages.find]
where = ["src"]
