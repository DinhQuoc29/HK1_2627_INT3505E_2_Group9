<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chấm độ phù hợp sản phẩm</title>
<style>
:root{font-family:"Segoe UI",sans-serif;color:#132a30;background:#f6f9f9;line-height:1.55}*{box-sizing:border-box}body{margin:0}header,main{max-width:1120px;margin:auto;padding:24px}header{border-bottom:2px solid #156b67}h1{font-size:30px;line-height:1.2;margin:0 0 10px}h2{font-size:23px}button,input,select,textarea{font:inherit;border:1px solid #8ca5a6;border-radius:5px;padding:9px;background:white;color:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}.primary{background:#156b67;color:white;border-color:#156b67}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #dc9d1b;outline-offset:2px}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}#message{min-height:24px;color:#8a3b13}#task{background:white;padding:20px;border-left:4px solid #156b67;position:sticky;top:0;z-index:2;box-shadow:0 3px 12px #132a3010}#task p{margin:6px 0}article{display:grid;grid-template-columns:180px 1fr;gap:22px;padding:24px 0;border-bottom:1px solid #b9cccc}article img{width:180px;height:200px;object-fit:contain;background:white}article h3{margin:0 0 5px;font-size:18px}article p{margin:4px 0}.grade{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.grade button[aria-pressed=true]{background:#156b67;color:white;border-color:#156b67}textarea{width:100%;min-height:52px}summary{cursor:pointer;color:#156b67}.description{white-space:pre-wrap;overflow-wrap:anywhere;max-height:320px;overflow:auto}small{color:#425d60}#progress{font-weight:600}label{display:inline-flex;gap:8px;align-items:center}input[type=checkbox]{width:18px;height:18px}@media(max-width:650px){header,main{padding:16px}article{grid-template-columns:85px 1fr;gap:12px}article img{width:85px;height:120px}h1{font-size:25px}#task{position:static}.controls select{max-width:100%}}
</style>
<header><h1>Chấm độ phù hợp sản phẩm</h1><p>0 — Không phù hợp · 1 — Phù hợp một phần · 2 — Phù hợp · 3 — Rất phù hợp.</p>
<p>Chấm theo nhu cầu, loại món và ngân sách. Thiếu thông tin thì ghi chú, không tự suy diễn. Ô chưa chấm được giữ trống.</p>
<div class="controls"><label>Người chấm <input id="name" placeholder="Tên hoặc mã của bạn" maxlength="80"></label><button class="primary" id="start">Bắt đầu / Tiếp tục</button><span id="role"></span></div>
<div class="controls"><button id="backup" disabled>Tải bản nháp JSON</button><label>Khôi phục bản nháp <input id="restore" type="file" accept="application/json,.json" disabled></label><button id="csv" disabled>Tải CSV</button></div>
<p id="progress"></p><p id="message" role="status" aria-live="polite"></p></header>
<main hidden id="main"><section id="task"><div class="controls"><button id="prev">Trước</button><label>Nhu cầu <select id="queries"></select></label><button id="next">Sau</button><label><input id="pending" type="checkbox">Chỉ hiện chưa chấm</label></div><h2 id="query"></h2><p id="budget"></p><p id="coverage"></p><p id="queryProgress"></p></section><div id="products"></div></main>
<script id="data" type="application/json">/*__PAYLOAD__*/</script>
<script>
'use strict';
const packet=JSON.parse(document.getElementById('data').textContent);
const el=id=>document.getElementById(id), key=r=>JSON.stringify([r.query_id,r.slot,r.product_id]);
const roles={'train-validation':'Train / Validation','test-a':'Test — người A','test-b':'Test — người B'};
const groups=new Map(); for(const r of packet.rows){if(!groups.has(r.query_id))groups.set(r.query_id,[]);groups.get(r.query_id).push(r)}
let labels={},annotator='',storageKey='',started=false;
const queryIds=[...groups.keys()];
el('role').textContent=roles[packet.role];
for(const qid of queryIds){const op=document.createElement('option');op.value=qid;op.textContent=qid;el('queries').append(op)}
function message(text){el('message').textContent=text}
function completed(row){return labels[key(row)] && /^[0-3]$/.test(String(labels[key(row)].grade))}
function progress(){const n=packet.rows.filter(completed).length;el('progress').textContent=`Đã chấm ${n} / ${packet.rows.length} sản phẩm trong ${queryIds.length} nhu cầu.`;return n}
function save(){try{localStorage.setItem(storageKey,JSON.stringify(labels));message('Đã lưu điểm trong trình duyệt. Tải bản nháp JSON để có bản sao an toàn.')}catch(e){message('Trình duyệt không lưu được điểm. Hãy tải bản nháp JSON ngay.')}progress()}
function validateLabels(value){const keys=new Set(packet.rows.map(key));if(!value || Array.isArray(value)||typeof value!=='object')throw Error('Nhãn không hợp lệ');for(const [k,v]of Object.entries(value)){if(!keys.has(k)||!v||!['','0','1','2','3'].includes(String(v.grade))||typeof v.notes!=='string')throw Error('Bản nháp chứa dòng hoặc điểm không hợp lệ')}return value}
el('start').onclick=()=>{const who=el('name').value.trim();if(!who){message('Nhập tên hoặc mã người chấm trước.');return}annotator=who;storageKey='fashion-labels:'+packet.pool_sha256+':'+packet.role+':'+who;try{labels=validateLabels(JSON.parse(localStorage.getItem(storageKey)||'{}'))}catch(e){labels={};message('Không đọc được bản lưu. Khôi phục từ bản nháp JSON nếu có.')}started=true;el('name').disabled=true;el('start').disabled=true;for(const id of ['backup','restore','csv'])el(id).disabled=false;el('main').hidden=false;progress();render()};
function render(){const qid=el('queries').value,rows=groups.get(qid);el('query').textContent=rows[0].query;el('budget').textContent='Tổng ngân sách cả bộ: '+Number(rows[0].budget).toLocaleString('vi-VN')+' đ. Mỗi sản phẩm bên dưới chỉ là một ứng viên cho một loại món.';const missing=(packet.empty_slots||[]).filter(r=>r.query_id===qid).map(r=>r.slot);el('coverage').textContent=missing.length?'Pool chưa có ứng viên cho: '+missing.join(', ')+'. Không tự bổ sung sản phẩm hoặc nhãn.':'';el('queryProgress').textContent=`${rows.filter(completed).length}/${rows.length} ứng viên của nhu cầu này đã chấm.`;el('prev').disabled=queryIds.indexOf(qid)===0;el('next').disabled=queryIds.indexOf(qid)===queryIds.length-1;el('products').replaceChildren();
for(const r of rows){if(el('pending').checked&&completed(r))continue;const article=document.createElement('article'),picture=document.createElement('div'),image=document.createElement('img'),body=document.createElement('div');image.alt=r.product_name;image.loading='lazy';image.referrerPolicy='no-referrer';if(/^https:\/\//i.test(r.image_url))image.src=r.image_url;image.onerror=()=>{image.remove();const p=document.createElement('p');p.textContent='Ảnh không tải được';picture.append(p)};picture.append(image);article.append(picture,body);const title=document.createElement('h3');title.textContent=r.product_name;const info=document.createElement('p');info.textContent=Number(r.price).toLocaleString('vi-VN')+' đ · Loại món: '+r.slot+' · Tồn kho nguồn: '+r.inventory_status;const details=document.createElement('details'),summary=document.createElement('summary'),description=document.createElement('p');summary.textContent='Xem mô tả đầy đủ';description.className='description';description.textContent=r.description;details.append(summary,description);body.append(title,info,details);const choices=document.createElement('div');choices.className='grade';for(const [grade,text]of [['0','0 — Không phù hợp'],['1','1 — Một phần'],['2','2 — Phù hợp'],['3','3 — Rất phù hợp']]){const b=document.createElement('button');b.textContent=text;b.setAttribute('aria-pressed',String(labels[key(r)]?.grade===grade));b.onclick=()=>{labels[key(r)]={grade,notes:labels[key(r)]?.notes||''};save();render()};choices.append(b)}const clear=document.createElement('button');clear.textContent='Bỏ điểm';clear.onclick=()=>{labels[key(r)]={grade:'',notes:labels[key(r)]?.notes||''};save();render()};choices.append(clear);const note=document.createElement('textarea');note.placeholder='Ghi chú: thiếu thông tin, sai loại món, nhu cầu chưa rõ…';note.setAttribute('aria-label','Ghi chú cho '+r.product_name);note.value=labels[key(r)]?.notes||'';note.onchange=()=>{labels[key(r)]={grade:labels[key(r)]?.grade||'',notes:note.value};save()};body.append(choices,note);el('products').append(article)}
if(!el('products').children.length){const p=document.createElement('p');p.textContent='Nhu cầu này đã chấm hết. Chuyển sang nhu cầu tiếp theo hoặc bỏ bộ lọc.';el('products').append(p)}}
el('queries').onchange=render;el('pending').onchange=render;el('prev').onclick=()=>{el('queries').selectedIndex--;render()};el('next').onclick=()=>{el('queries').selectedIndex++;render()};
function download(text,type,filename){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
el('backup').onclick=()=>download(JSON.stringify({pool_sha256:packet.pool_sha256,role:packet.role,annotator,labels},null,2),'application/json','draft-'+packet.role+'.json');
el('restore').onchange=async()=>{try{const draft=JSON.parse(await el('restore').files[0].text());if(draft.pool_sha256!==packet.pool_sha256||draft.role!==packet.role||draft.annotator!==annotator)throw Error('Bản nháp khác bộ dữ liệu, vai trò hoặc người chấm.');const incoming=validateLabels(draft.labels);if(Object.keys(labels).length&&!confirm('Thay điểm đang có bằng bản nháp này?'))return;labels=incoming;save();render()}catch(e){message('Không khôi phục được: '+e.message)}finally{el('restore').value=''}};
el('csv').onclick=()=>{const quote=v=>'"'+String(v??'').replaceAll('"','""')+'"';const output=[packet.columns.map(quote).join(',')];for(const r of packet.rows){const grade=labels[key(r)]?.grade||'',row={...r,grade,annotator:grade!==''?annotator:'',notes:labels[key(r)]?.notes||''};output.push(packet.columns.map(c=>quote(row[c])).join(','))}const n=progress(),filename=(n===packet.rows.length?'':'PARTIAL-')+packet.filename;download('\ufeff'+output.join('\r\n')+'\r\n','text/csv;charset=utf-8',filename);message(n===packet.rows.length?'Đã xuất CSV đủ nhãn. Giữ bản JSON để sao lưu.':'Đã xuất CSV chưa đủ nhãn (PARTIAL). Tiếp tục chấm trước khi train.')};
progress();
</script></html>
